<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1 id="titulo">Meu planjeador de Estudo</h1>
        <h2>Nova tarefa</h2>
        <input type="text" id="tarefa" placeholder="Digite o nome da tarefa">
        <input type="text" id="materia" placeholder="Digite a materia">

        <select id="prioridade">
            <option value="">Selecione a priopridade</option>
            <option value="Baixa">Baixa</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
        </select>

        <button onclick="adicionarTarefa()">
            Cadastrar tarefa
        </button>
        <button onclick="limparCampos()">
            Limpar campos
        </button>

        <p id="mensagem"></p>

        <div class="contadores">
            <p class="contador">Tarefas cadastrar: 0</p>
            <p class="contadorConcluidas">Tarefas concluidas: 0</p>
        </div>

        <button onclick="alterarModo()">
            Modo de concentração
        </button>

        <h2>Minhas tarefas</h2>

        <div id="listaTarefas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
